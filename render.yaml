services:
  - type: web
    name: wine-tasting-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wine-tasting-db
          property: connectionString
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_HOST
        sync: false
    healthCheckPath: /health

databases:
  - name: wine-tasting-db
    databaseName: wine_tasting
    plan: free
